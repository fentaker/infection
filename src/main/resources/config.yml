# Конфигурация плагина "Инфекция" (Allum: GO!)

spread:
  radius: 2                     # на сколько блоков во все стороны расширяется фронт за цикл
  interval-minutes: 5           # фиксированный интервал цикла распространения (без роста по фазам)

mobs:
  lifetime-seconds: 300         # сколько живёт заражённый моб (5 минут)
  scan-interval-ticks: 20       # раз в сколько тиков сканировать мобов/блоки (20 = 1 сек)
  ai-radius: 16                 # радиус поиска цели для заражённого моба
  attack-reach: 2.5             # дистанция атаки
  move-speed: 1.0               # скорость передвижения к цели
  attack-damage: 3.0            # урон за один удар заражённого моба
  attack-cooldown-ticks: 20     # минимальный интервал между ударами (20 = 1 сек)

mushrooms:
  small-tick-seconds: 10        # раз в сколько секунд проверяется случайный блок на маленький гриб
  small-chance: 0.15            # шанс появления маленького гриба
  giant-tick-seconds: 60        # раз в сколько секунд проверяется гигантский гриб
  giant-chance: 0.03            # шанс появления гигантского гриба

player-effects:
  wither-delay-seconds: 60           # через сколько секунд непрерывного нахождения добавляется Иссушение
  linger-seconds: 10                 # сколько эффекты держатся после выхода с территории
  wither-damage-interval-seconds: 2  # раз в сколько секунд наносится урон от Иссушения (не завязано на ванильный тик эффекта)
  wither-damage-amount: 1.0          # урон за один тик Иссушения (1.0 = пол-сердца)

fire:
  revert-delay-seconds: 5       # через сколько секунд после появления огня блок восстанавливается

potion:
  brew-time-minutes: 10         # сколько варится Зелье адаптации (Грибная спора + Мутное зелье)
  adaptation-buff-minutes: 5    # на сколько минут даёт баф адаптации (подавляет Иссушение от инфекции)

player-infection:
  # Дебафы вне заражённой земли для ЗАРАЖЁННОГО игрока (Слабость II и Голод II — сразу, без задержки).
  off-zone-wither-damage-interval-seconds: 2  # раз в сколько секунд наносится урон от Иссушения II
  off-zone-wither-damage-amount: 1.5          # урон за один тик Иссушения II (сильнее, чем у обычного игрока)

autosave-minutes: 5             # период автосохранения состояния на диск
