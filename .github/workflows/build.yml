name: Build plugin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установка JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Сборка (mvn package)
        run: mvn -B package

      - name: Публикация jar как артефакта
        uses: actions/upload-artifact@v4
        with:
          name: AllumInfection-jar
          path: target/AllumInfection.jar
